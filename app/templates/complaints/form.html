{% extends "base.html" %}{% block title %}New Complaint{% endblock %}
{% block content %}<div class="form-card"><h1>Report Complaint / Problem</h1><form method="post">
<label>Category<select name="category" required><option value="">Select</option><option>Traffic</option><option>Accommodation</option><option>Food</option><option>Medical</option><option>Security</option><option>Other</option></select></label>
