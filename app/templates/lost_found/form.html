{% extends "base.html" %}{% block title %}New Lost & Found Report{% endblock %}
{% block content %}<div class="form-card"><h1>Lost & Found Report</h1><form method="post">
<label>Report Type<select name="report_type" required><option value="">Select</option><option>Lost</option><option>Found</option></select></label>
<label>Description<textarea name="description" required rows="6" placeholder="Describe the item/person and relevant details"></textarea></label>
<label>Location<input name="location" required></label><button class="btn">Submit Report</button></form></div>{% endblock %}
