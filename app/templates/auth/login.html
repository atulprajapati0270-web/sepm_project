{% extends "base.html" %}
{% block title %}{{ 'लॉगिन' if is_hindi else 'Login' }}{% endblock %}
{% block content %}
<div class="form-card"><h1>{{ 'लॉगिन करें' if is_hindi else 'Login' }}</h1>
<form method="post">
<label>{{ 'ईमेल' if is_hindi else 'Email' }}<input type="email" name="email" required></label>
<label>{{ 'पासवर्ड' if is_hindi else 'Password' }}<input type="password" name="password" required></label>
<button class="btn">{{ 'लॉगिन' if is_hindi else 'Login' }}</button>
</form>
<p>{{ 'नए आगंतुक हैं?' if is_hindi else 'New visitor?' }} <a href="{{ url_for('auth.register') }}">{{ 'खाता बनाएं' if is_hindi else 'Create an account' }}</a></p></div>
{% endblock %}
